<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小五數學練習</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDpgJqVcPV46C6Rtz7whNIUZKIPm5hoxjY",
      authDomain: "p5d-math.firebaseapp.com",
      projectId: "p5d-math",
      storageBucket: "p5d-math.firebasestorage.app",
      messagingSenderId: "578211936126",
      appId: "1:578211936126:web:c5e11e812bbb893187a52f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const questions = [
      { q: "2 又 4/9 × 9/14 = ?", options: ["2/7", "4/7", "1 又 4/7", "5 又 1/7"], answer: 2 },
      { q: "4 又 1/2 × 8/9 × 15/16 = ?", options: ["3 又 1/4", "3 又 3/4", "4", "5"], answer: 1 },
      { q: "如果 2 又 1/2 × ● × ■ = 3 又 2/3，那麼 ■ × ● × 5 = ?", options: ["7 又 1/3", "6 又 2/3", "5", "2 又 2/3"], answer: 0 },
      { q: "下列哪一條算式的結果最大？可用估算的方法找出答案。", options: ["8 又 1/3 × 5 又 41/43", "3 又 1/5 × 9 又 28/47", "10 又 5/7 × 3 又 1/3", "9 又 5/6 × 4 又 4/5"], answer: 3 }
    ];

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const statusEl = document.getElementById("status");
    const quizEl = document.getElementById("quiz");
    const submitBtn = document.getElementById("submitBtn");
    const resultEl = document.getElementById("result");

    function renderQuiz() {
      quizEl.innerHTML = questions.map((item, i) => `
        <fieldset>
          <legend>${i + 1}. ${item.q}</legend>
          ${item.options.map((opt, j) => `
            <label>
              <input type="radio" name="q${i}" value="${j}">
              ${"ABCD"[j]}. ${opt}
            </label>
          `).join("<br>")}
        </fieldset>
      `).join("");
    }

    loginBtn.addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        statusEl.textContent = "登入失敗：" + error.message;
      }
    });

    logoutBtn.addEventListener("click", () => signOut(auth));

    submitBtn.addEventListener("click", async () => {
      const user = auth.currentUser;
      if (!user) return;
      let score = 0;
      const answers = [];
      for (let i = 0; i < questions.length; i++) {
        const chosen = document.querySelector(`input[name="q${i}"]:checked`);
        const value = chosen ? Number(chosen.value) : null;
        answers.push(value);
        if (value === questions[i].answer) score += 1;
      }
      resultEl.textContent = `你的分數：${score} / ${questions.length}`;
      try {
        await addDoc(collection(db, "scores"), {
          email: user.email,
          uid: user.uid,
          practice: "分數乘法",
          score,
          total: questions.length,
          answers,
          submittedAt: serverTimestamp()
        });
      } catch (error) {
        resultEl.textContent += "（分數未能儲存：" + error.message + "）";
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        loginBtn.hidden = true;
        logoutBtn.hidden = false;
        quizEl.hidden = false;
        submitBtn.hidden = false;
        statusEl.textContent = "已登入：" + user.email;
        renderQuiz();
        try {
          await addDoc(collection(db, "logins"), {
            email: user.email,
            uid: user.uid,
            loggedInAt: serverTimestamp()
          });
        } catch (error) {
          statusEl.textContent = "已登入，但記錄未能儲存：" + error.message;
        }
      } else {
        loginBtn.hidden = false;
        logoutBtn.hidden = true;
        quizEl.hidden = true;
        submitBtn.hidden = true;
        resultEl.textContent = "";
        statusEl.textContent = "尚未登入";
      }
    });
  </script>
</head>
<body>
  <h1>小五數學練習：分數乘法</h1>
  <p id="status">載入中……</p>
  <button id="loginBtn" type="button">使用學校 Google 電郵登入</button>
  <button id="logoutBtn" type="button" hidden>登出</button>
  <form id="quiz" hidden></form>
  <p>
    <button id="submitBtn" type="button" hidden>提交答案</button>
  </p>
  <p id="result"></p>
</body>
</html>
